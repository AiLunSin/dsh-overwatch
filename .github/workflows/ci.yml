name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check
        run: node scripts/check-syntax.mjs
      - name: Unit, scenario, router and panel tests
        run: npm test
      - name: Package contents
        run: npm pack --dry-run

  release-build:
    name: release build (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build the scoped release copy
        run: npm run build:release
      - name: Pack and inspect the release tarball
        run: |
          cd dist/ailunsin--dsh-overwatch
          npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-overwatch-release
          path: dist/ailunsin--dsh-overwatch
          if-no-files-found: error
